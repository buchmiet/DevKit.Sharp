name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Override every package Version (leave empty to use per-project Version in each csproj)
        required: false
        type: string
      project:
        description: Pack a single csproj (repo-relative). Empty packs the whole solution.
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    environment: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Verify contract boundary
        run: python eng/verify-contract-boundary.py

      - name: Pack
        shell: pwsh
        run: |
          $project = "${{ github.event.inputs.project }}".Trim()
          $override = "${{ github.event.inputs.version }}".Trim()
          $target = if ($project) { $project } else { "DevKit.Sharp.slnx" }
          $args = @("pack", $target, "-c", "Release", "-o", "artifacts/packages")
          if ($override) { $args += "-p:Version=$override" }
          dotnet @args

      - name: Publish to NuGet.org
        shell: bash
        run: dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Publish symbols
        shell: bash
        run: dotnet nuget push artifacts/packages/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
