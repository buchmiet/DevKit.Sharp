name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Verify contract boundary
        run: python eng/verify-contract-boundary.py

      - name: Restore
        run: dotnet restore DevKit.Sharp.slnx

      - name: Build
        run: dotnet build DevKit.Sharp.slnx -c Release --no-restore

      - name: Test
        run: |
          dotnet run --project tests/DevKit.Logging.Sharp.Tests -c Release --no-build
          dotnet run --project tests/DevKit.Screenshot.Sharp.Tests -c Release --no-build
          dotnet run --project tests/DevKit.Screenshot.Avalonia.Sharp.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack DevKit.Sharp.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
